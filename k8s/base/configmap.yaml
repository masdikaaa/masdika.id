# ==============================================================================
# 2. CONFIGMAP (Non-sensitive application settings)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-config
  namespace: masdika
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  TZ: "Asia/Jakarta"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  USE_REDIS: "true"
  USE_KAFKA: "true"
  KAFKA_BROKERS: "masdika-kafka.masdika.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "masdika-backend"
  DB_HOST: "masdika-db"
  DB_PORT: "5432"
  DB_NAME: "masdika"
  DB_USER: "masdika"
  ELASTIC_URL: "http://elasticsearch:9200"
  VECTOR_URL: "http://vector:5044"
  LOGSTASH_URL: "http://vector:5044"
  APM_SERVER_URL: "http://apm-server:8200"
  ELASTIC_APM_SERVER_URL: "http://apm-server:8200"
  ELASTIC_APM_SERVICE_NAME: "masdika-web"
  ELASTIC_APM_ENVIRONMENT: "production"
  NEXT_PUBLIC_APP_URL: "https://masdika.id"
