# ==============================================================================
# ZERO TRUST NETWORK POLICIES (Enterprise Database & Cache Isolation)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: masdika-db-isolation
  namespace: masdika
  labels:
    app.kubernetes.io/part-of: masdika
    security.kubernetes.io/tier: database
spec:
  podSelector:
    matchLabels:
      app: masdika-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: masdika-app
        - podSelector:
            matchLabels:
              app: masdika-worker
        - podSelector:
            matchLabels:
              app: masdika-vnc-proxy
        - podSelector:
            matchLabels:
              app: masdika-backup
        - podSelector:
            matchLabels:
              app: masdika-heartbeat
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: masdika-pg-pooler
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: masdika-cnpg-pooler-isolation
  namespace: masdika
  labels:
    app.kubernetes.io/part-of: masdika
    security.kubernetes.io/tier: connection-pooler
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: masdika-pg-pooler
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: masdika-app
        - podSelector:
            matchLabels:
              app: masdika-worker
        - podSelector:
            matchLabels:
              app: masdika-vnc-proxy
        - podSelector:
            matchLabels:
              app: masdika-heartbeat
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: masdika-redis-isolation
  namespace: masdika
  labels:
    app.kubernetes.io/part-of: masdika
    security.kubernetes.io/tier: cache
spec:
  podSelector:
    matchLabels:
      app: masdika-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: masdika-app
        - podSelector:
            matchLabels:
              app: masdika-worker
        - podSelector:
            matchLabels:
              app: masdika-vnc-proxy
        - podSelector:
            matchLabels:
              app: masdika-backup
        - podSelector:
            matchLabels:
              app: masdika-heartbeat
