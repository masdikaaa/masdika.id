apiVersion: v1
kind: Service
metadata:
  name: masdika-app
  namespace: masdika
  labels:
    app: masdika-app
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: masdika-app

---
apiVersion: v1
kind: Service
metadata:
  name: masdika-vnc-proxy
  namespace: masdika
  labels:
    app: masdika-vnc-proxy
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: vnc-proxy
  selector:
    app: masdika-vnc-proxy
