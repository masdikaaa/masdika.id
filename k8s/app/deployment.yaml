# ==============================================================================
# 8. VNC PROXY (Dedicated WebSocket Proxy for Server / VNC Console)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-vnc-proxy
  namespace: masdika
  labels:
    app: masdika-vnc-proxy
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-vnc-proxy
  template:
    metadata:
      labels:
        app: masdika-vnc-proxy
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Checking PostgreSQL connection (masdika-db:5432)..."
              until nc -z -w 3 masdika-db 5432; do
                echo "PostgreSQL is not ready yet. Retrying in 2 seconds..."
                sleep 2
              done
              echo "PostgreSQL is online and accepting connections!"

              echo "Checking Redis connection (masdika-redis:6379)..."
              until nc -z -w 3 masdika-redis 6379; do
                echo "Redis is not ready yet. Retrying in 2 seconds..."
                sleep 2
              done
              echo "Redis is online and accepting connections!"
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: vnc-proxy
          image: andikaferdialvianto/masdika-id:0771ad0479ea0bc1f410ed8e180b627b8fa37204
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - "sh"
            - "-c"
            - "cd /app/apps/web && exec node vnc-proxy.js"
          ports:
            - containerPort: 3001
              name: vnc-proxy
          envFrom:
            - configMapRef:
                name: masdika-config
            - secretRef:
                name: masdika-credentials
            - secretRef:
                name: masdika-env
                optional: true
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: REDIS_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

