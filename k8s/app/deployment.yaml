# ==============================================================================
# 6. APPLICATION (Next.js Standalone Web App)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-app
  namespace: masdika
  labels:
    app: masdika-app
spec:
  # Replicas dikelola dinamis oleh HPA (2 - 5 pods)
  replicas: 2
  revisionHistoryLimit: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: masdika-app
  template:
    metadata:
      labels:
        app: masdika-app
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001 # GID nodejs agar permissions mount uploads writable oleh user nextjs
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Checking PostgreSQL connection (masdika-db:5432)..."
              until nc -z -w 3 masdika-db 5432; do
                echo "PostgreSQL is not ready yet. Retrying in 2 seconds..."
                sleep 2
              done
              echo "PostgreSQL is online and accepting connections!"

              echo "Checking Redis connection (masdika-redis:6379)..."
              until nc -z -w 3 masdika-redis 6379; do
                echo "Redis is not ready yet. Retrying in 2 seconds..."
                sleep 2
              done
              echo "Redis is online and accepting connections!"

              echo "Checking Elasticsearch connection (elasticsearch:9200)..."
              until nc -z -w 3 elasticsearch 9200; do
                echo "Elasticsearch is not ready yet. Retrying in 3 seconds..."
                sleep 3
              done
              echo "Elasticsearch is online and accepting connections!"

              echo "Checking Kafka connection (masdika-kafka:9092)..."
              until nc -z -w 3 masdika-kafka 9092; do
                echo "Kafka is not ready yet. Retrying in 2 seconds..."
                sleep 2
              done
              echo "Kafka is online and accepting connections!"
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: app
          image: andikaferdialvianto/masdika-id:0771ad0479ea0bc1f410ed8e180b627b8fa37204
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: masdika-config
            - secretRef:
                name: masdika-credentials
            # Opsional: Jika Anda membuat secret `masdika-env` dari file .env:
            - secretRef:
                name: masdika-env
                optional: true
          env:
            # Overrides eksplisit agar mengarah ke Service internal Kubernetes
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: REDIS_URL
            - name: ELASTIC_URL
              valueFrom:
                configMapKeyRef:
                  name: masdika-config
                  key: ELASTIC_URL
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: ELASTIC_PASSWORD
                  optional: true
          volumeMounts:
            # Buffer sementara untuk chunked uploads raw streaming (aset permanen disimpan di RustFS)
            - name: app-storage
              mountPath: /app/apps/web/storage/upload-buffers
              subPath: upload-buffers
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sleep
                  - "5"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: masdika-storage-pvc
---
# ==============================================================================
# 7. BACKGROUND WORKER (Cron, Queue & Auto Billing Checks)
# ==============================================================================
apiVersion: apps/v1
