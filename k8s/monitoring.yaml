# ==============================================================================
# OBSERVABILITY & MONITORING STACK (Kibana, Grafana, Prometheus, Loki, Logstash)
# Namespace: masdika
# Cluster: K3s Production
# GitOps: ArgoCD Managed
# ==============================================================================

---
# ==============================================================================
# 1. STORAGE (PersistentVolumeClaims for Observability Data)
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: masdika-prometheus-pvc
  namespace: masdika
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: masdika-grafana-pvc
  namespace: masdika
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: masdika-loki-pvc
  namespace: masdika
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
# ==============================================================================
# 2. CONFIGMAPS (Pipelines, Scrape Configs & DataSources)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-logstash-config
  namespace: masdika
data:
  logstash.conf: |
    input {
      http {
        port => 5044
        codec => json
      }
    }
    filter {
      # JSON logs are parsed directly by the http input codec
    }
    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        user => "elastic"
        password => "${ELASTIC_PASSWORD}"
        index => "logstash-%{+YYYY.MM.dd}"
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-prometheus-config
  namespace: masdika
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "node-exporter"
        static_configs:
          - targets: ["masdika-node-exporter:9100"]

      - job_name: "masdika-app"
        metrics_path: "/api/metrics"
        static_configs:
          - targets: ["masdika-app:3000"]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-loki-config
  namespace: masdika
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    analytics:
      reporting_enabled: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-grafana-datasources
  namespace: masdika
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://masdika-prometheus:9090
        isDefault: true
        editable: true

      - name: Loki
        type: loki
        access: proxy
        url: http://masdika-loki:3100
        isDefault: false
        editable: true

      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        database: "logstash-*"
        jsonData:
          esVersion: "8.15.0"
          timeField: "@timestamp"
        isDefault: false
        editable: true

---
# ==============================================================================
# 3. LOGSTASH (Log Ingestion Pipeline for Next.js App)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-logstash
  namespace: masdika
  labels:
    app: masdika-logstash
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-logstash
  template:
    metadata:
      labels:
        app: masdika-logstash
    spec:
      automountServiceAccountToken: false
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.15.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: ELASTIC_PASSWORD
                  optional: true
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: xpack.monitoring.enabled
              value: "false"
          ports:
            - containerPort: 5044
              hostPort: 5044
              name: http-log
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"
      volumes:
        - name: config
          configMap:
            name: masdika-logstash-config

---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: masdika
  labels:
    app: masdika-logstash
spec:
  type: ClusterIP
  ports:
    - port: 5044
      targetPort: 5044
      name: http-log
  selector:
    app: masdika-logstash

---
apiVersion: v1
kind: Service
metadata:
  name: masdika-logstash
  namespace: masdika
  labels:
    app: masdika-logstash
spec:
  type: ClusterIP
  ports:
    - port: 5044
      targetPort: 5044
      name: http-log
  selector:
    app: masdika-logstash

---
# ==============================================================================
# 4. KIBANA (Elasticsearch Visualization Dashboard)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-kibana
  namespace: masdika
  labels:
    app: masdika-kibana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-kibana
  template:
    metadata:
      labels:
        app: masdika-kibana
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
            - name: ELASTICSEARCH_USERNAME
              value: "kibana_system"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masdika-env
                  key: KIBANA_PASSWORD
                  optional: true
            - name: SERVER_PUBLICBASEURL
              value: "https://kibana.masdika.id"
          ports:
            - containerPort: 5601
              hostPort: 5601
              name: http
          resources:
            requests:
              cpu: "150m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: masdika
  labels:
    app: masdika-kibana
spec:
  type: ClusterIP
  ports:
    - port: 5601
      targetPort: 5601
      name: http
  selector:
    app: masdika-kibana

---
apiVersion: v1
kind: Service
metadata:
  name: masdika-kibana
  namespace: masdika
  labels:
    app: masdika-kibana
spec:
  type: ClusterIP
  ports:
    - port: 5601
      targetPort: 5601
      name: http
  selector:
    app: masdika-kibana

---
# ==============================================================================
# 5. PROMETHEUS (Metrics Aggregation & Monitoring)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-prometheus
  namespace: masdika
  labels:
    app: masdika-prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-prometheus
  template:
    metadata:
      labels:
        app: masdika-prometheus
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              hostPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: masdika-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: masdika-prometheus-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: masdika
  labels:
    app: masdika-prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: masdika-prometheus

---
apiVersion: v1
kind: Service
metadata:
  name: masdika-prometheus
  namespace: masdika
  labels:
    app: masdika-prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: masdika-prometheus

---
# ==============================================================================
# 6. NODE EXPORTER (Host Hardware Metrics for Prometheus)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-node-exporter
  namespace: masdika
  labels:
    app: masdika-node-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-node-exporter
  template:
    metadata:
      labels:
        app: masdika-node-exporter
    spec:
      hostPID: true
      automountServiceAccountToken: false
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--path.rootfs=/host"
          ports:
            - containerPort: 9100
              hostPort: 9100
              name: metrics
          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
      volumes:
        - name: rootfs
          hostPath:
            path: /

---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: masdika
  labels:
    app: masdika-node-exporter
spec:
  type: ClusterIP
  ports:
    - port: 9100
      targetPort: 9100
      name: metrics
  selector:
    app: masdika-node-exporter

---
apiVersion: v1
kind: Service
metadata:
  name: masdika-node-exporter
  namespace: masdika
  labels:
    app: masdika-node-exporter
spec:
  type: ClusterIP
  ports:
    - port: 9100
      targetPort: 9100
      name: metrics
  selector:
    app: masdika-node-exporter

---
# ==============================================================================
# 7. GRAFANA LOKI (Log Aggregation Engine)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-loki
  namespace: masdika
  labels:
    app: masdika-loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-loki
  template:
    metadata:
      labels:
        app: masdika-loki
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/loki/loki.yaml"
          ports:
            - containerPort: 3100
              hostPort: 3100
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: masdika-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: masdika-loki-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: masdika
  labels:
    app: masdika-loki
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: 3100
      name: http
  selector:
    app: masdika-loki

---
apiVersion: v1
kind: Service
metadata:
  name: masdika-loki
  namespace: masdika
  labels:
    app: masdika-loki
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: 3100
      name: http
  selector:
    app: masdika-loki

---
# ==============================================================================
# 8. GRAFANA (Unified Metrics & Logs Visualization Dashboard)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-grafana
  namespace: masdika
  labels:
    app: masdika-grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-grafana
  template:
    metadata:
      labels:
        app: masdika-grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "http://192.168.79.4:3001"
          ports:
            - containerPort: 3000
              hostPort: 3001
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: masdika-grafana-pvc
        - name: datasources
          configMap:
            name: masdika-grafana-datasources

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: masdika
  labels:
    app: masdika-grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: masdika-grafana

---
apiVersion: v1
kind: Service
metadata:
  name: masdika-grafana
  namespace: masdika
  labels:
    app: masdika-grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: masdika-grafana

---
# ==============================================================================
# 9. TRAEFIK INGRESS (Public Access for Observability Dashboards)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: masdika-monitoring-ingress
  namespace: masdika
  labels:
    app: masdika-monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: masdika-security-headers@kubernetescrd
spec:
  rules:
    - host: grafana.masdika.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: masdika-grafana
                port:
                  number: 3000
    - host: kibana.masdika.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: masdika-kibana
                port:
                  number: 5601
    - host: prometheus.masdika.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: masdika-prometheus
                port:
                  number: 9090
