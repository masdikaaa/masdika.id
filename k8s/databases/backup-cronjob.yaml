apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: masdika-backup-pvc
  namespace: masdika
  labels:
    app: masdika-backup
    app.kubernetes.io/part-of: masdika
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 15Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: masdika-postgres-backup
  namespace: masdika
  labels:
    app: masdika-backup
    app.kubernetes.io/part-of: masdika
spec:
  schedule: "0 2 * * *" # Daily at 02:00 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: masdika-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgres-backup
              image: postgres:18-alpine
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGHOST
                  value: masdika-db
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: POSTGRES_DB
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
                  BACKUP_FILE="/backups/masdika_db_${TIMESTAMP}.sql.gz"
                  echo "[$(date)] Starting PostgreSQL backup for database: ${PGDATABASE}..."
                  
                  # Dump with gzip compression
                  pg_dump -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" --clean --if-exists --no-owner --no-privileges | gzip -9 > "${BACKUP_FILE}"
                  
                  SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
                  echo "[$(date)] Backup completed successfully: ${BACKUP_FILE} (${SIZE})"
                  
                  # Retention policy: Prune backups older than 7 days
                  echo "[$(date)] Pruning backups older than 7 days..."
                  find /backups -type f -name "masdika_db_*.sql.gz" -mtime +7 -exec rm -v {} \;
                  echo "[$(date)] Disaster Recovery Backup Lifecycle finished."
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup-volume
                  mountPath: /backups
          volumes:
            - name: backup-volume
              persistentVolumeClaim:
                claimName: masdika-backup-pvc
