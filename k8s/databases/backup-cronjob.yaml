apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: masdika-backup-pvc
  namespace: masdika
  labels:
    app: masdika-backup
    app.kubernetes.io/part-of: masdika
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 15Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: masdika-postgres-backup
  namespace: masdika
  labels:
    app: masdika-backup
    app.kubernetes.io/part-of: masdika
spec:
  schedule: "0 2 * * *" # Daily at 02:00 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: masdika-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgres-backup
              image: postgres:18.7-alpine
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGHOST
                  value: masdika-db
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: POSTGRES_DB
                - name: ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: masdika-env
                      key: ENCRYPTION_KEY
                - name: RUSTFS_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: RUSTFS_ENDPOINT
                - name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: RUSTFS_ACCESS_KEY
                - name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: RUSTFS_SECRET_KEY
                - name: RUSTFS_DATABASE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: RUSTFS_DATABASE_BUCKET
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  echo "[$(date)] Installing disaster recovery backup tools (gnupg, rclone)..."
                  apk add --no-cache gnupg rclone

                  export RCLONE_CONFIG_RUSTFS_TYPE="s3"
                  export RCLONE_CONFIG_RUSTFS_PROVIDER="Minio"
                  export RCLONE_CONFIG_RUSTFS_ENDPOINT="${RUSTFS_ENDPOINT}"
                  export RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}"
                  export RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}"

                  TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
                  BACKUP_FILE="/backups/masdika_db_${TIMESTAMP}.sql.gz.gpg"
                  echo "[$(date)] Starting PostgreSQL dump, gzip compression, and GPG AES256 encryption..."
                  
                  pg_dump -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" --clean --if-exists --no-owner --no-privileges \
                    | gzip -9 \
                    | gpg --batch --yes --passphrase "${ENCRYPTION_KEY}" --cipher-algo AES256 -c -o "${BACKUP_FILE}"
                  
                  SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
                  echo "[$(date)] Encrypted backup created successfully: ${BACKUP_FILE} (${SIZE})"
                  
                  echo "[$(date)] Syncing offsite backup to RustFS S3 bucket (${RUSTFS_DATABASE_BUCKET})..."
                  rclone copyto "${BACKUP_FILE}" "rustfs:${RUSTFS_DATABASE_BUCKET}/$(basename ${BACKUP_FILE})"
                  echo "[$(date)] RustFS Cloud sync completed successfully."

                  # Retention policy: Prune local PVC backups older than 14 days
                  echo "[$(date)] Pruning local PVC backups older than 14 days..."
                  find /backups -type f -name "masdika_db_*.sql.gz*" -mtime +14 -exec rm -v {} \;

                  # Retention policy: Prune remote RustFS backups older than 14 days
                  echo "[$(date)] Pruning remote RustFS S3 backups older than 14 days..."
                  rclone delete --min-age 14d "rustfs:${RUSTFS_DATABASE_BUCKET}"

                  echo "[$(date)] Disaster Recovery Backup Lifecycle completed successfully."
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup-volume
                  mountPath: /backups
          volumes:
            - name: backup-volume
              persistentVolumeClaim:
                claimName: masdika-backup-pvc
