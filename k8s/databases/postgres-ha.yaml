# ==============================================================================
# CloudNativePG (CNPG) High-Availability PostgreSQL Cluster
# Architecture: 1 Primary + 1 Streaming Standby Replica (Automated Failover)
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: masdika-pg-secret
  namespace: masdika
type: kubernetes.io/basic-auth
stringData:
  username: masdika
  password: Andikaferdi11
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: masdika-pg-ha
  namespace: masdika
  labels:
    app.kubernetes.io/name: masdika-pg-ha
    app.kubernetes.io/instance: masdika-pg-ha
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2

  inheritedMetadata:
    annotations:
      container.apparmor.security.beta.kubernetes.io/postgres: unconfined
      container.apparmor.security.beta.kubernetes.io/initdb: unconfined
      container.apparmor.security.beta.kubernetes.io/bootstrap-controller: unconfined

  primaryUpdateStrategy: unsupervised

  failoverDelay: 0
  minSyncReplicas: 0
  maxSyncReplicas: 0

  storage:
    size: 20Gi
    storageClass: local-path

  bootstrap:
    initdb:
      database: masdika
      owner: masdika
      secret:
        name: masdika-pg-secret

  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      work_mem: "4MB"
      random_page_cost: "1.1"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

---
# ==============================================================================
# CloudNativePG (CNPG) Native PgBouncer Connection Pooler
# Architecture: 2 Replicas, High-Performance Transaction Pooling
# Service: masdika-pg-pooler:5432 -> masdika-pg-ha-rw:5432
# ==============================================================================
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: masdika-pg-pooler
  namespace: masdika
  labels:
    app.kubernetes.io/name: masdika-pg-pooler
    app.kubernetes.io/instance: masdika-pg-ha
    cnpg.io/poolerName: masdika-pg-pooler
spec:
  cluster:
    name: masdika-pg-ha
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
      min_pool_size: "5"
      reserve_pool_size: "5"
      max_db_connections: "100"
      server_reset_query: "DISCARD ALL"
      ignore_startup_parameters: "extra_float_digits"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
