# ==============================================================================
# 1. STORAGE (PersistentVolumeClaims - K3s local-path provisioner)
# ==============================================================================

# PVC untuk PostgreSQL Database Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: masdika-db-pvc
  namespace: masdika
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
# ==============================================================================
# 4. DATABASE (PostgreSQL 18)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-db
  namespace: masdika
  labels:
    app: masdika-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-db
  template:
    metadata:
      labels:
        app: masdika-db
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        runAsUser: 70
        runAsGroup: 70
      containers:
        - name: postgres
          image: postgres:18.7-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - SYS_PTRACE
          args:
            - "-c"
            - "io_method=sync"
            - "-c"
            - "recovery_init_sync_method=fsync"
            - "-c"
            - "synchronous_commit=off"
            - "-c"
            - "max_connections=300"
            - "-c"
            - "shared_buffers=512MB"
            - "-c"
            - "effective_cache_size=1536MB"
            - "-c"
            - "work_mem=4MB"
            - "-c"
            - "random_page_cost=1.1"
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: POSTGRES_DB
                  optional: true
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: POSTGRES_USER
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql
            - name: dshm
              mountPath: /dev/shm
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "pg_ctl stop -D /var/lib/postgresql/18/docker -m fast || true"
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U masdika -h 127.0.0.1 -p 5432"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U masdika -h 127.0.0.1 -p 5432"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U masdika -h 127.0.0.1 -p 5432"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: masdika-db-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: masdika-db
  namespace: masdika
  labels:
    app: masdika-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: masdika-db
