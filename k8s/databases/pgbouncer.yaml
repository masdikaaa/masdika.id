# ==============================================================================
# PgBouncer Connection Pooler (Standalone Deployment)
# Enterprise Connection Pooling for Standalone PostgreSQL (masdika-db)
# Architecture: 2 Replicas, Transaction Mode, Max 1000 Clients -> 25 Backend Conn
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-pgbouncer
  namespace: masdika
  labels:
    app: masdika-pgbouncer
    app.kubernetes.io/name: masdika-pgbouncer
    app.kubernetes.io/part-of: masdika
    app.kubernetes.io/component: database-pooler
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: masdika-pgbouncer
  template:
    metadata:
      labels:
        app: masdika-pgbouncer
        app.kubernetes.io/name: masdika-pgbouncer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.23.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DB_HOST
              value: "masdika-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: POSTGRES_USER
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "1000"
            - name: DEFAULT_POOL_SIZE
              value: "25"
            - name: MIN_POOL_SIZE
              value: "5"
            - name: RESERVE_POOL_SIZE
              value: "5"
            - name: MAX_DB_CONNECTIONS
              value: "100"
            - name: IGNORE_STARTUP_PARAMETERS
              value: "extra_float_digits"
            - name: SERVER_RESET_QUERY
              value: "DISCARD ALL"
            - name: AUTH_TYPE
              value: "scram-sha-256"
          ports:
            - containerPort: 5432
              name: pgbouncer
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: masdika-pgbouncer
  namespace: masdika
  labels:
    app: masdika-pgbouncer
    app.kubernetes.io/name: masdika-pgbouncer
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: pgbouncer
      protocol: TCP
  selector:
    app: masdika-pgbouncer
