apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-grafana-datasources
  namespace: masdika
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://masdika-prometheus:9090
        uid: "PBFA97CFB590B2093"
        isDefault: true
        editable: true
        jsonData:
          timeInterval: "15s"
          httpMethod: "POST"

      - name: Loki
        type: loki
        access: proxy
        url: http://masdika-loki:3100
        uid: "P8E80F9AEF21F6940"
        isDefault: false
        editable: true
        jsonData:
          maxLines: 1000

      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        uid: "P31C819B24CF3C3C7"
        database: "logstash-*"
        basicAuth: true
        basicAuthUser: "elastic"
        secureJsonData:
          basicAuthPassword: $__env{ELASTIC_PASSWORD}
        jsonData:
          esVersion: "8.15.0"
          timeField: "@timestamp"
        isDefault: false
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-grafana-dashboard-providers
  namespace: masdika
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Masdika Monitoring'
        orgId: 1
        folder: 'Masdika Platform'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/json
---
# ==============================================================================
# 8. GRAFANA (Unified Metrics & Logs Visualization Dashboard)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-grafana
  namespace: masdika
  labels:
    app: masdika-grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-grafana
  template:
    metadata:
      labels:
        app: masdika-grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.masdika.id/"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: ELASTIC_PASSWORD
                  optional: true
          ports:
            - containerPort: 3000
              hostPort: 3001
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards-json
              mountPath: /etc/grafana/provisioning/dashboards/json
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: masdika-grafana-pvc
        - name: datasources
          configMap:
            name: masdika-grafana-datasources
        - name: dashboard-providers
          configMap:
            name: masdika-grafana-dashboard-providers
        - name: dashboards-json
          configMap:
            name: masdika-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: masdika
  labels:
    app: masdika-grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: masdika-grafana
---
apiVersion: v1
kind: Service
metadata:
  name: masdika-grafana
  namespace: masdika
  labels:
    app: masdika-grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: masdika-grafana
