apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-grafana-datasources
  namespace: masdika
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://masdika-prometheus:9090
        isDefault: true
        editable: true

      - name: Loki
        type: loki
        access: proxy
        url: http://masdika-loki:3100
        isDefault: false
        editable: true

      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        database: "logstash-*"
        jsonData:
          esVersion: "8.15.0"
          timeField: "@timestamp"
        isDefault: false
        editable: true
---
# ==============================================================================
# 8. GRAFANA (Unified Metrics & Logs Visualization Dashboard)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-grafana
  namespace: masdika
  labels:
    app: masdika-grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-grafana
  template:
    metadata:
      labels:
        app: masdika-grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "http://192.168.79.4:3001"
          ports:
            - containerPort: 3000
              hostPort: 3001
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: masdika-grafana-pvc
        - name: datasources
          configMap:
            name: masdika-grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: masdika
  labels:
    app: masdika-grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: masdika-grafana
---
apiVersion: v1
kind: Service
metadata:
  name: masdika-grafana
  namespace: masdika
  labels:
    app: masdika-grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: masdika-grafana
