apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-loki-config
  namespace: masdika
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    analytics:
      reporting_enabled: false
---
# ==============================================================================
# 7. GRAFANA LOKI (Log Aggregation Engine)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-loki
  namespace: masdika
  labels:
    app: masdika-loki
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-loki
  template:
    metadata:
      labels:
        app: masdika-loki
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/loki/loki.yaml"
          ports:
            - containerPort: 3100
              hostPort: 3100
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: masdika-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: masdika-loki-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: masdika
  labels:
    app: masdika-loki
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: 3100
      name: http
  selector:
    app: masdika-loki
---
apiVersion: v1
kind: Service
metadata:
  name: masdika-loki
  namespace: masdika
  labels:
    app: masdika-loki
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: 3100
      name: http
  selector:
    app: masdika-loki
