apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-prometheus-rules
  namespace: masdika
  labels:
    app: masdika-prometheus
data:
  alert-rules.yaml: |
    groups:
      - name: masdika-infrastructure-alerts
        rules:
          # 1. Host Node Disk Running Out
          - alert: HostDiskRunningOut
            expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
            for: 5m
            labels:
              severity: critical
              tier: infrastructure
            annotations:
              summary: "Root Disk Usage is above 85% on node {{ $labels.instance }}"
              description: "Root filesystem on {{ $labels.instance }} is currently {{ printf \"%.2f\" $value }}% full. Immediate cleanup required."

          # 2. Host Node Memory High
          - alert: HostMemoryRunningOut
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 5m
            labels:
              severity: warning
              tier: infrastructure
            annotations:
              summary: "Host RAM Usage is above 85% on node {{ $labels.instance }}"
              description: "Memory consumption on {{ $labels.instance }} is currently {{ printf \"%.2f\" $value }}%."

          # 3. Host Node CPU High
          - alert: HostCpuHighUsage
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 5m
            labels:
              severity: warning
              tier: infrastructure
            annotations:
              summary: "Host CPU Usage is above 85% on node {{ $labels.instance }}"
              description: "CPU load on {{ $labels.instance }} is currently {{ printf \"%.2f\" $value }}%."

      - name: masdika-pod-workload-alerts
        rules:
          # 4. Pod / Container Memory Usage Exceeding 85% of Limit
          - alert: PodMemoryUsageHigh
            expr: (container_memory_working_set_bytes{namespace="masdika", container!="", container!="POD"} / container_spec_memory_limit_bytes{namespace="masdika", container!="", container!="POD"}) * 100 > 85
            for: 3m
            labels:
              severity: warning
              tier: workload
            annotations:
              summary: "Pod Memory usage > 85% limit: {{ $labels.pod }} ({{ $labels.container }})"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has used {{ printf \"%.2f\" $value }}% of its allocated memory limit. Risk of OOMKill."

          # 5. Pod / Container Filesystem Usage Exceeding 85%
          - alert: PodDiskUsageHigh
            expr: (container_fs_usage_bytes{namespace="masdika", container!="", container!="POD"} / container_fs_limit_bytes{namespace="masdika", container!="", container!="POD"}) * 100 > 85
            for: 3m
            labels:
              severity: critical
              tier: workload
            annotations:
              summary: "Pod Filesystem usage > 85%: {{ $labels.pod }} ({{ $labels.container }})"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has used {{ printf \"%.2f\" $value }}% of its filesystem limit."

          # 6. PersistentVolumeClaim (PVC) Storage Filling Up (> 85%)
          - alert: PvcStorageRunningOut
            expr: (kubelet_volume_stats_used_bytes{namespace="masdika"} / kubelet_volume_stats_capacity_bytes{namespace="masdika"}) * 100 > 85
            for: 5m
            labels:
              severity: critical
              tier: storage
            annotations:
              summary: "PVC Storage > 85% Full: {{ $labels.persistentvolumeclaim }}"
              description: "PersistentVolumeClaim {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is {{ printf \"%.2f\" $value }}% full."

          # 7. Pod CrashLooping or Restarting
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="masdika"}[15m]) * 60 > 0.2
            for: 2m
            labels:
              severity: critical
              tier: workload
            annotations:
              summary: "Pod is crashlooping: {{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} (container {{ $labels.container }}) in namespace {{ $labels.namespace }} is restarting frequently."

          # 8. Main Web App Status Down
          - alert: MasdikaAppDown
            expr: absent(container_memory_working_set_bytes{namespace="masdika", pod=~"masdika-app-.*", container="app"}) == 1
            for: 1m
            labels:
              severity: critical
              tier: application
            annotations:
              summary: "masdika-app container is DOWN"
              description: "The masdika-app pod/container is not running in Kubernetes namespace masdika."

      # ------------------------------------------------------------------------
      # Group 3: SRE Golden Signals & SLO Error Budget Rules (Tokopedia Standard)
      # ------------------------------------------------------------------------
      - name: masdika-sre-golden-signals
        rules:
          # 9. HTTP 5xx Error Rate > 1% (SLO Error Budget Burn)
          - alert: HighHttp5xxRate
            expr: (sum(rate(traefik_entrypoint_requests_total{code=~"5.."}[2m])) / sum(rate(traefik_entrypoint_requests_total[2m]))) * 100 > 1
            for: 2m
            labels:
              severity: critical
              tier: ingress
            annotations:
              summary: "HTTP 5xx Error Rate > 1% on Ingress (SLO Violation)"
              description: "Traefik reports elevated HTTP 5xx errors across incoming public traffic. Error budget is depleting fast."

          # 10. High Request Latency p99 (> 1.5s)
          - alert: HighRequestLatencyP99
            expr: histogram_quantile(0.99, sum(rate(traefik_entrypoint_request_duration_seconds_bucket[5m])) by (le)) > 1.5
            for: 5m
            labels:
              severity: warning
              tier: ingress
            annotations:
              summary: "p99 Request Latency > 1.5s (Degraded Performance)"
              description: "99th percentile response time exceeds 1.5 seconds across ingress endpoints."

          # 11. High Request Latency p95 (> 800ms)
          - alert: HighRequestLatencyP95
            expr: histogram_quantile(0.95, sum(rate(traefik_entrypoint_request_duration_seconds_bucket[5m])) by (le)) > 0.8
            for: 10m
            labels:
              severity: warning
              tier: ingress
            annotations:
              summary: "p95 Request Latency > 800ms"
              description: "95th percentile response time exceeds 800ms. Check database query performance and app memory pressure."

      # ------------------------------------------------------------------------
      # Group 4: SOC, Intrusion Detection & Threat Intelligence Alerts
      # ------------------------------------------------------------------------
      - name: masdika-security-alerts
        rules:
          # 12. Host SSH Unauthorized Login Detected (Whitelists user 'andika')
          - alert: HostSSHLoginDetected
            expr: (increase(promtail_custom_ssh_accepted_logins_total[2m]) - (increase(promtail_custom_ssh_andika_logins_total[2m]) or vector(0))) > 0
            for: 0m
            labels:
              severity: critical
              tier: security
            annotations:
              summary: "🚨 Unauthorized Host SSH Login on masdika"
              description: "A successful SSH login was authenticated for an UNAUTHORIZED user (non-andika) on Linux host masdika. Review /var/log/auth.log or Grafana SOC Cockpit immediately!"

          # 13. SSH Brute-Force Attack Spike
          - alert: HostSSHBruteForceAttempt
            expr: increase(promtail_custom_ssh_failed_logins_total[2m]) >= 5
            for: 0m
            labels:
              severity: critical
              tier: security
            annotations:
              summary: "🛡️ Host SSH Brute-Force Authentication Spike"
              description: "More than 5 failed SSH authentication attempts detected in under 2 minutes on host masdika. Potential brute-force dictionary attack in progress."

          # 14. Sudo Privilege Escalation Detected (Whitelists user 'andika')
          - alert: HostSudoPrivilegeElevation
            expr: (increase(promtail_custom_sudo_executions_total[2m]) - (increase(promtail_custom_sudo_andika_executions_total[2m]) or vector(0))) > 0
            for: 0m
            labels:
              severity: warning
              tier: security
            annotations:
              summary: "⚠️ Unauthorized Sudo Privilege Escalation Executed"
              description: "A command was executed with elevated root privileges via sudo by an UNAUTHORIZED user (non-andika) on Linux host masdika."

          # 15. Web Attack Scanner / Vulnerability Probe Spike
          - alert: WebAttackScannerSpike
            expr: sum(rate(traefik_entrypoint_requests_total{code=~"401|403|404"}[2m])) > 15
            for: 1m
            labels:
              severity: warning
              tier: security
            annotations:
              summary: "🔍 Web Attack Probe / Scanner Spike Detected"
              description: "Abnormal surge in HTTP 401/403/404 errors (>15 req/s) detected on Traefik ingress. Possible vulnerability scanning, path directory traversal, or automated exploit bots."

          # 16. Web Rate Limit Throttling Attack (DDoS / Scraping)
          - alert: WebRateLimitThrottlingSpike
            expr: sum(rate(traefik_entrypoint_requests_total{code="429"}[2m])) > 5
            for: 1m
            labels:
              severity: warning
              tier: security
            annotations:
              summary: "🛑 Ingress Rate-Limiting Active (HTTP 429 Surge)"
              description: "Traefik rate-limiting middleware is aggressively throttling incoming malicious traffic (>5 req/s blocked with HTTP 429). Ingress DDoS/scraping mitigation active."

      # ==========================================
      # 5. ENTERPRISE SRE SLI/SLO & ERROR BUDGET ALERTS
      # ==========================================
      - name: masdika-sre-slo-alerts
        rules:
          # 17. SRE Availability SLO Breach (< 99.9% Three-Nines)
          - alert: SREAvailabilitySLOBreach
            expr: clamp_max((1 - ((sum(increase(traefik_service_requests_total{service=~"masdika-masdika-app.*", code=~"5.."}[1h])) or vector(0)) / (sum(increase(traefik_service_requests_total{service=~"masdika-masdika-app.*"}[1h])) or vector(1)))) * 100, 100) < 99.9
            for: 5m
            labels:
              severity: critical
              tier: sre
            annotations:
              summary: "?? SRE SLO Breach: Masdika Availability Dropped Below 99.9%"
              description: "Platform availability in the last 1 hour has fallen below the 99.9% Three-Nines SLO. Immediate SRE triage required."

          # 18. SRE Error Budget Rapid Burn (> 14.4x normal rate)
          - alert: SREErrorBudgetRapidBurn
            expr: (((sum(rate(traefik_service_requests_total{service=~"masdika-masdika-app.*", code=~"5.."}[1h])) or vector(0)) / (sum(rate(traefik_service_requests_total{service=~"masdika-masdika-app.*"}[1h])) or vector(1))) / 0.001) > 14.4
            for: 2m
            labels:
              severity: critical
              tier: sre
            annotations:
              summary: "?? SRE Emergency: Error Budget Rapidly Burning (>14x Rate)"
              description: "The 30-day error budget is burning 14.4x faster than normal. At this rate, 2% of the entire monthly budget is consumed every single hour. Activate incident response."
