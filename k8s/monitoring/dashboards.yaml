apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-grafana-dashboards
  namespace: masdika
  labels:
    app: masdika-grafana
data:
  node-infra.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "id": 1,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "type": "gauge",
          "title": "Host CPU Utilization",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[1m])) * 100)",
              "legendFormat": "CPU Usage %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "type": "gauge",
          "title": "Host Memory Utilization",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
              "legendFormat": "RAM Usage %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "type": "gauge",
          "title": "Host Root Disk Usage",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 88
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}) * 100)",
              "legendFormat": "Disk Usage %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "type": "stat",
          "title": "Host System Uptime",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "time() - node_boot_time_seconds",
              "legendFormat": "Uptime",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "type": "timeseries",
          "title": "Host CPU Usage History",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "avg by (mode) (rate(node_cpu_seconds_total[1m])) * 100",
              "legendFormat": "{{mode}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "type": "timeseries",
          "title": "Host Memory Distribution",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 20
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes",
              "legendFormat": "Total",
              "refId": "A"
            },
            {
              "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes",
              "legendFormat": "Used",
              "refId": "B"
            },
            {
              "expr": "node_memory_MemAvailable_bytes",
              "legendFormat": "Available",
              "refId": "C"
            },
            {
              "expr": "node_memory_Cached_bytes + node_memory_Buffers_bytes",
              "legendFormat": "Cached & Buffers",
              "refId": "D"
            }
          ]
        },
        {
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "type": "timeseries",
          "title": "System Load Average (1m, 5m, 15m)",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "node_load1",
              "legendFormat": "Load 1m",
              "refId": "A"
            },
            {
              "expr": "node_load5",
              "legendFormat": "Load 5m",
              "refId": "B"
            },
            {
              "expr": "node_load15",
              "legendFormat": "Load 15m",
              "refId": "C"
            }
          ]
        },
        {
          "id": 8,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "type": "timeseries",
          "title": "Host Network Traffic (I/O)",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(node_network_receive_bytes_total{device!~\"lo|veth.*|flannel.*|cni.*\"}[1m]))",
              "legendFormat": "Receive (Inbound)",
              "refId": "A"
            },
            {
              "expr": "sum(rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|flannel.*|cni.*\"}[1m]))",
              "legendFormat": "Transmit (Outbound)",
              "refId": "B"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "masdika",
        "infrastructure",
        "node"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m"
        ]
      },
      "timezone": "browser",
      "title": "Server & Node Infrastructure",
      "uid": "masdika-node-infra",
      "version": 2
    }
  app-health.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "id": 1,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "type": "stat",
          "title": "Total Running Pods",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "count(count by (pod) (container_memory_working_set_bytes{namespace=\"masdika\", container!=\"POD\", container!=\"\"}))",
              "legendFormat": "Running Pods",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "type": "stat",
          "title": "Total Pods RAM In-Use",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 3000000000
                  },
                  {
                    "color": "red",
                    "value": 6000000000
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"masdika\", container!=\"POD\", container!=\"\"})",
              "legendFormat": "Total RAM",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "type": "stat",
          "title": "Cluster Node Disk In-Use (/)",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 140000000000
                  },
                  {
                    "color": "red",
                    "value": 170000000000
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "node_filesystem_size_bytes{mountpoint=\"/\"} - node_filesystem_avail_bytes{mountpoint=\"/\"}",
              "legendFormat": "Used Disk (/dev/sda1)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "type": "stat",
          "title": "Active Monitored Targets",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(up)",
              "legendFormat": "Scrape Targets UP",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "type": "timeseries",
          "title": "RAM Usage per Pod (Working Set)",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"masdika\", container!=\"POD\", container!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "type": "timeseries",
          "title": "CPU Rate per Pod (Usage %)",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 20
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"masdika\", container!=\"POD\", container!=\"\"}[1m])) * 100",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "type": "timeseries",
          "title": "PVC Storage Volume Capacity & Used (Disk)",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kubelet_volume_stats_capacity_bytes{namespace=\"masdika\"}",
              "legendFormat": "{{persistentvolumeclaim}} - Capacity",
              "refId": "A"
            },
            {
              "expr": "kubelet_volume_stats_used_bytes{namespace=\"masdika\"}",
              "legendFormat": "{{persistentvolumeclaim}} - Used",
              "refId": "B"
            }
          ]
        },
        {
          "id": 8,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "type": "timeseries",
          "title": "PVC Storage Volume Usage Rate (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 20
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "(kubelet_volume_stats_used_bytes{namespace=\"masdika\"} / kubelet_volume_stats_capacity_bytes{namespace=\"masdika\"}) * 100",
              "legendFormat": "{{persistentvolumeclaim}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "masdika",
        "pods",
        "workloads",
        "cadvisor"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m"
        ]
      },
      "timezone": "browser",
      "title": "Masdika Web App & Pods Health",
      "uid": "masdika-app-health",
      "version": 2
    }
  loki-logs.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "id": 1,
          "gridPos": {
            "h": 20,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "type": "logs",
          "title": "Live Container Logs (Promtail Stream - namespace: masdika)",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "options": {
            "showLabels": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "targets": [
            {
              "expr": "{namespace=\"masdika\"}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": [
        "masdika",
        "loki",
        "logs"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m"
        ]
      },
      "timezone": "browser",
      "title": "Centralized Logs Explorer (Loki)",
      "uid": "masdika-loki-logs",
      "version": 2
    }
  sre-golden-signals.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "id": 1,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "type": "gauge",
          "title": "Availability SLI (Target: 99.9% Three-Nines)",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "min": 98,
              "max": 100,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 99
                  },
                  {
                    "color": "green",
                    "value": 99.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "clamp_max((1 - ((sum(increase(traefik_service_requests_total{service=~\"masdika-masdika-app.*\", code=~\"5..\"}[24h])) or vector(0)) / (sum(increase(traefik_service_requests_total{service=~\"masdika-masdika-app.*\"}[24h])) or vector(1)))) * 100, 100)",
              "legendFormat": "Availability %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "type": "gauge",
          "title": "Monthly Error Budget Remaining",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 20
                  },
                  {
                    "color": "green",
                    "value": 50
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "clamp_min(clamp_max(((((1 - ((sum(increase(traefik_service_requests_total{service=~\"masdika-masdika-app.*\", code=~\"5..\"}[24h])) or vector(0)) / (sum(increase(traefik_service_requests_total{service=~\"masdika-masdika-app.*\"}[24h])) or vector(1)))) * 100) - 99.9) / 0.1) * 100, 100), 0)",
              "legendFormat": "Budget Remaining %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "type": "stat",
          "title": "1h Error Budget Burn Rate",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "clamp_min(((sum(rate(traefik_service_requests_total{service=~\"masdika-masdika-app.*\", code=~\"5..\"}[1h])) or vector(0)) / (sum(rate(traefik_service_requests_total{service=~\"masdika-masdika-app.*\"}[1h])) or vector(1))) / 0.001, 0)",
              "legendFormat": "Burn Rate (1x = normal)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "type": "stat",
          "title": "SRE Release Gate Policy",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 20,
                    "to": 100,
                    "result": {
