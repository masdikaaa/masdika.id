apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-alertmanager-config
  namespace: masdika
  labels:
    app: masdika-alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'mail.masdika.id:587'
      smtp_from: 'info@masdika.id'
      smtp_auth_username: 'info@masdika.id'
      smtp_auth_password_file: '/etc/alertmanager/secrets/smtp-password'
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'namespace', 'tier']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'email-admin'
      routes:
        - match:
            severity: critical
          receiver: 'email-admin'
          repeat_interval: 1h

    receivers:
      - name: 'email-admin'
        email_configs:
          - to: 'andikaferdialvianto@gmail.com'
            send_resolved: true
            headers:
              Subject: '[{{ .Status | toUpper }}] Masdika Infrastructure Alert: {{ .CommonLabels.alertname }}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-alertmanager
  namespace: masdika
  labels:
    app: masdika-alertmanager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-alertmanager
  template:
    metadata:
      labels:
        app: masdika-alertmanager
    spec:
      automountServiceAccountToken: false
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - containerPort: 9093
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
            - name: smtp-secret
              mountPath: /etc/alertmanager/secrets
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: masdika-alertmanager-config
        - name: storage
          emptyDir: {}
        - name: smtp-secret
          secret:
            secretName: masdika-credentials
            items:
              - key: SMTP_AUTH_PASSWORD
                path: smtp-password
---
apiVersion: v1
kind: Service
metadata:
  name: masdika-alertmanager
  namespace: masdika
  labels:
    app: masdika-alertmanager
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: 9093
      name: http
  selector:
    app: masdika-alertmanager

