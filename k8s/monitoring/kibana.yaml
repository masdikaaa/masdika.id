# ==============================================================================
# 4. KIBANA (Elasticsearch Visualization Dashboard)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-kibana
  namespace: masdika
  labels:
    app: masdika-kibana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: masdika-kibana
  template:
    metadata:
      labels:
        app: masdika-kibana
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
            - name: ELASTICSEARCH_USERNAME
              value: "kibana_system"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masdika-env
                  key: KIBANA_PASSWORD
                  optional: true
            - name: SERVER_PUBLICBASEURL
              value: "https://kibana.masdika.id"
          ports:
            - containerPort: 5601
              hostPort: 5601
              name: http
          resources:
            requests:
              cpu: "150m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: masdika
  labels:
    app: masdika-kibana
spec:
  type: ClusterIP
  ports:
    - port: 5601
      targetPort: 5601
      name: http
  selector:
    app: masdika-kibana
---
apiVersion: v1
kind: Service
metadata:
  name: masdika-kibana
  namespace: masdika
  labels:
    app: masdika-kibana
spec:
  type: ClusterIP
  ports:
    - port: 5601
      targetPort: 5601
      name: http
  selector:
    app: masdika-kibana
