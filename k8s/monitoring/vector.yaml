# ==============================================================================
# VECTOR.DEV ULTRA-LIGHTWEIGHT LOG PIPELINE (Rust-Based Log Aggregator)
# Replaces heavy JVM Logstash (Saves ~1.2 GB of RAM per instance)
# Architecture: Dual-Sink (Elasticsearch ECS Data Stream + Grafana Loki)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-vector-config
  namespace: masdika
  labels:
    app: masdika-vector
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: masdika
    app.kubernetes.io/component: telemetry-pipeline
data:
  vector.yaml: |
    # --------------------------------------------------------------------------
    # Global Settings
    # --------------------------------------------------------------------------
    data_dir: "/var/lib/vector"

    # --------------------------------------------------------------------------
    # Sources: Ingest HTTP JSON logs & Vector telemetry metrics
    # --------------------------------------------------------------------------
    sources:
      app_http_logs:
        type: "http_server"
        address: "0.0.0.0:5044"
        path: "/"
        strict_path: false
        decoding:
          codec: "json"

      internal_metrics:
        type: "internal_metrics"

    # --------------------------------------------------------------------------
    # Transforms: Elastic Common Schema (ECS) Normalization via VRL
    # --------------------------------------------------------------------------
    transforms:
      ecs_parser:
        type: "remap"
        inputs:
          - "app_http_logs"
        source: |
          # If message string contains nested JSON, parse and merge fields
          if is_string(.message) {
            parsed, err = parse_json(.message)
            if err == null {
              . |= parsed
            }
          }

          # Standardize log level
          if exists(.level) {
            .log.level = downcase(to_string!(.level))
          } else {
            .log.level = "info"
          }

          # Service & Environment Metadata
          if exists(.app) {
            .service.name = to_string!(.app)
          } else {
            .service.name = "masdika-web"
          }

          if exists(.env) {
            .service.environment = to_string!(.env)
          } else {
            .service.environment = "production"
          }

          # Host Physical & Container Metadata
          .host.name = "masdika"

          # Distributed APM Tracing Correlation (Elastic APM / OpenTelemetry)
          if is_object(.context) {
            if exists(.context.trace_id) {
              .trace.id = to_string!(.context.trace_id)
            }
            if exists(.context.transaction_id) {
              .transaction.id = to_string!(.context.transaction_id)
            }
            if exists(.context.ip) {
              .client.ip = to_string!(.context.ip)
            }
            if exists(.context.method) {
              .http.request.method = to_string!(.context.method)
            }
            if exists(.context.url) {
              .url.path = to_string!(.context.url)
            }
          }

          # Standardized ISO-8601 Timestamp
          if exists(.timestamp) {
            @timestamp = parse_timestamp(.timestamp, "%+") ?? now()
          } else {
            @timestamp = now()
          }

          # Export simple top-level fields for Grafana Loki label templating
          .app_name = .service.name
          .env_name = .service.environment
          .log_level = .log.level

    # --------------------------------------------------------------------------
    # Sinks: Dual-Sink to Elasticsearch & Grafana Loki + Prometheus Exporter
    # --------------------------------------------------------------------------
    sinks:
      elasticsearch:
        type: "elasticsearch"
        inputs:
          - "ecs_parser"
        endpoints:
          - "http://elasticsearch:9200"
        auth:
          strategy: "basic"
          user: "elastic"
          password: "${ELASTIC_PASSWORD:-Andikaferdi11}"
        mode: "data_stream"
        data_stream:
          type: "logs"
          dataset: "masdika.app"
          namespace: "default"
        compression: "gzip"
        batch:
          max_events: 500
          timeout_secs: 1.0

      loki:
        type: "loki"
        inputs:
          - "ecs_parser"
        endpoint: "http://masdika-loki:3100"
        labels:
          job: "vector-app"
          app: "{{ app_name }}"
          env: "{{ env_name }}"
          level: "{{ log_level }}"
        encoding:
          codec: "json"

      prometheus_metrics:
        type: "prometheus_exporter"
        inputs:
          - "internal_metrics"
        address: "0.0.0.0:9090"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masdika-vector
  namespace: masdika
  labels:
    app: masdika-vector
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: masdika
    app.kubernetes.io/component: telemetry-pipeline
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: masdika-vector
  template:
    metadata:
      labels:
        app: masdika-vector
        app.kubernetes.io/name: vector
    spec:
      automountServiceAccountToken: false
      containers:
        - name: vector
          image: timberio/vector:0.43.0-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/vector/vector.yaml"
          env:
            - name: VECTOR_LOG
              value: "info"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masdika-credentials
                  key: ELASTIC_PASSWORD
                  optional: true
          ports:
            - containerPort: 5044
              name: http-log
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          securityContext:
            runAsUser: 0
          readinessProbe:
            tcpSocket:
              port: 5044
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 5044
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/vector/vector.yaml
              subPath: vector.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
      volumes:
        - name: config
          configMap:
            name: masdika-vector-config
        - name: data
          emptyDir: {}
---
# Primary Vector Service
apiVersion: v1
kind: Service
metadata:
  name: masdika-vector
  namespace: masdika
  labels:
    app: masdika-vector
    app.kubernetes.io/name: vector
spec:
  type: ClusterIP
  ports:
    - port: 5044
      targetPort: 5044
      name: http-log
      protocol: TCP
    - port: 9090
      targetPort: 9090
      name: metrics
      protocol: TCP
  selector:
    app: masdika-vector
---
# Short DNS Service: vector:5044
apiVersion: v1
kind: Service
metadata:
  name: vector
  namespace: masdika
  labels:
    app: masdika-vector
    app.kubernetes.io/name: vector
spec:
  type: ClusterIP
  ports:
    - port: 5044
      targetPort: 5044
      name: http-log
      protocol: TCP
    - port: 9090
      targetPort: 9090
      name: metrics
      protocol: TCP
  selector:
    app: masdika-vector
---
# Backward-Compatibility Alias: logstash:5044
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: masdika
  labels:
    app: masdika-vector
    app.kubernetes.io/name: vector
    app.kubernetes.io/legacy-alias: logstash
spec:
  type: ClusterIP
  ports:
    - port: 5044
      targetPort: 5044
      name: http-log
      protocol: TCP
  selector:
    app: masdika-vector
---
# Backward-Compatibility Alias: masdika-logstash:5044
apiVersion: v1
kind: Service
metadata:
  name: masdika-logstash
  namespace: masdika
  labels:
    app: masdika-vector
    app.kubernetes.io/name: vector
    app.kubernetes.io/legacy-alias: logstash
spec:
  type: ClusterIP
  ports:
    - port: 5044
      targetPort: 5044
      name: http-log
      protocol: TCP
  selector:
    app: masdika-vector
