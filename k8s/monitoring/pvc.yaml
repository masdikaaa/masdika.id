# ==============================================================================
# 1. STORAGE (PersistentVolumeClaims for Observability Data)
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: masdika-prometheus-pvc
  namespace: masdika
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: masdika-grafana-pvc
  namespace: masdika
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: masdika-loki-pvc
