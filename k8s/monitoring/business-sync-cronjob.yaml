apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-es-sync-script
  namespace: masdika
  labels:
    app: masdika-es-sync
data:
  sync.py: |
    import json, urllib.request, os, psycopg2

    db_host = os.environ.get("DB_HOST", "masdika-db")
    db_name = os.environ.get("DB_NAME", "masdika")
    db_user = os.environ.get("DB_USER", "masdika")
    db_pass = os.environ.get("DB_PASS", "")
    es_host = os.environ.get("ES_HOST", "http://elasticsearch:9200")
    es_user = os.environ.get("ES_USER", "elastic")
    es_pass = os.environ.get("ES_PASS", "")

    auth_es = "Basic " + __import__("base64").b64encode(f"{es_user}:{es_pass}".encode()).decode()

    def index_doc(index_name, doc_id, doc):
        url = f"{es_host}/{index_name}/_doc/{doc_id}"
        req = urllib.request.Request(url, data=json.dumps(doc).encode(), headers={
            "Authorization": auth_es,
            "Content-Type": "application/json"
        }, method="PUT")
        with urllib.request.urlopen(req) as resp:
            pass

    conn = psycopg2.connect(host=db_host, dbname=db_name, user=db_user, password=db_pass)
    cur = conn.cursor()

    # 1. VPS
    cur.execute('SELECT id, hostname, "osTemplate", "cpuCores", "ramGb", "diskGb", status, "hourlyRate", node, "createdAt" FROM "VpsService"')
    for r in cur.fetchall():
        doc = {
            "id": r[0],
            "hostname": r[1],
            "osTemplate": r[2],
            "cpuCores": r[3],
            "ramGb": r[4],
            "diskGb": r[5],
            "status": r[6],
            "hourlyRate": r[7] or 0,
            "node": r[8],
            "@timestamp": r[9].isoformat() if r[9] else None
        }
        index_doc("masdika-vps", r[0], doc)

    # 2. Media
    cur.execute('SELECT id, filename, "originalName", "mimeType", size, "isPublic", "createdAt" FROM "SecureMedia"')
    for r in cur.fetchall():
        doc = {
            "id": r[0],
            "filename": r[1],
            "originalName": r[2],
            "mimeType": r[3],
            "sizeBytes": r[4],
            "sizeMB": round(r[4] / (1024 * 1024), 2),
            "isPublic": r[5],
            "@timestamp": r[6].isoformat() if r[6] else None
        }
        index_doc("masdika-media", r[0], doc)

    # 3. Invoices
    cur.execute('SELECT id, "invoiceNumber", amount, status, "paymentMethod", "createdAt" FROM "Invoice"')
    for r in cur.fetchall():
        doc = {
            "id": r[0],
            "invoiceNumber": r[1],
            "amount": r[2],
            "status": r[3],
            "paymentMethod": r[4],
            "@timestamp": r[5].isoformat() if r[5] else None
        }
        index_doc("masdika-invoices", r[0], doc)

    # 4. Customers
    cur.execute('SELECT id, email, name, role, balance, "affiliateBalance", "isSuspended", "createdAt" FROM "User"')
    for r in cur.fetchall():
        doc = {
            "id": r[0],
            "email": r[1],
            "name": r[2],
            "role": r[3],
            "balance": r[4],
            "affiliateBalance": r[5],
            "isSuspended": r[6],
            "@timestamp": r[7].isoformat() if r[7] else None
        }
        index_doc("masdika-customers", r[0], doc)

    cur.close()
    conn.close()
    print("Masdika Cloud data synced successfully to Elasticsearch.")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: masdika-es-sync
  namespace: masdika
  labels:
    app: masdika-es-sync
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: masdika-worker
        spec:
          restartPolicy: OnFailure
          containers:
            - name: syncer
              image: python:3.12-alpine
              command:
                - sh
                - -c
                - "pip install --no-cache-dir psycopg2-binary && python /scripts/sync.py"
              env:
                - name: DB_HOST
                  value: "masdika-db"
                - name: DB_NAME
                  value: "masdika"
                - name: DB_USER
                  value: "masdika"
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: POSTGRES_PASSWORD
                - name: ES_HOST
                  value: "http://elasticsearch:9200"
                - name: ES_USER
                  value: "elastic"
                - name: ES_PASS
                  valueFrom:
                    secretKeyRef:
                      name: masdika-credentials
                      key: ELASTIC_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
                - name: script-vol
                  mountPath: /scripts
          volumes:
            - name: script-vol
              configMap:
                name: masdika-es-sync-script
