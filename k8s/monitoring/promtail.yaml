apiVersion: v1
kind: ServiceAccount
metadata:
  name: masdika-promtail
  namespace: masdika
  labels:
    app: masdika-promtail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: masdika-promtail-role
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: masdika-promtail-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: masdika-promtail-role
subjects:
  - kind: ServiceAccount
    name: masdika-promtail
    namespace: masdika
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: masdika-promtail-config
  namespace: masdika
  labels:
    app: masdika-promtail
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://masdika-loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__

      - job_name: host-auth
        static_configs:
          - targets:
              - localhost
            labels:
              job: host-auth
              node: masdika
              __path__: /var/log/auth.log
        pipeline_stages:
          # 1. Total SSH Logins (All users)
          - regex:
              expression: '.*(?P<ssh_accepted>Accepted (?:password|publickey)).*'
          - metrics:
              ssh_accepted_logins_total:
                type: Counter
                description: "Total successful SSH logins on the host"
                source: ssh_accepted
                config:
                  action: inc

          # 2. Authorized SSH Logins (User andika)
          - regex:
              expression: '.*(?P<ssh_andika>Accepted (?:password|publickey) for andika from).*'
          - metrics:
              ssh_andika_logins_total:
                type: Counter
                description: "Total authorized SSH logins by user andika"
                source: ssh_andika
                config:
                  action: inc

          # 3. Failed SSH Attempts / Brute-force
          - regex:
              expression: '.*(?P<ssh_failed>(?:Failed password|authentication failure|Invalid user)).*'
          - metrics:
              ssh_failed_logins_total:
                type: Counter
                description: "Total failed SSH authentication attempts on the host"
                source: ssh_failed
                config:
                  action: inc

          # 4. Total Sudo Executions (All users)
          - regex:
              expression: '.*(?P<sudo_exec>sudo:.*COMMAND=).*'
          - metrics:
              sudo_executions_total:
                type: Counter
                description: "Total sudo privilege escalation commands executed"
                source: sudo_exec
                config:
                  action: inc

          # 5. Authorized Sudo Executions (User andika)
          - regex:
              expression: '.*(?P<sudo_andika>sudo:\s*andika\s*:.*COMMAND=).*'
          - metrics:
              sudo_andika_executions_total:
                type: Counter
                description: "Total authorized sudo commands executed by andika"
                source: sudo_andika
                config:
                  action: inc
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: masdika-promtail
  namespace: masdika
  labels:
    app: masdika-promtail
spec:
  selector:
    matchLabels:
      app: masdika-promtail
  template:
    metadata:
      labels:
        app: masdika-promtail
    spec:
      serviceAccountName: masdika-promtail
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: promtail
          image: grafana/promtail:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/promtail/promtail.yaml"
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 9080
              name: http-metrics
          securityContext:
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: masdika-promtail-config
        - name: run
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: varlog
          hostPath:
            path: /var/log

---
apiVersion: v1
kind: Service
metadata:
  name: masdika-promtail
  namespace: masdika
  labels:
    app: masdika-promtail
spec:
  type: ClusterIP
  ports:
    - port: 9080
      targetPort: 9080
      name: http-metrics
  selector:
    app: masdika-promtail
