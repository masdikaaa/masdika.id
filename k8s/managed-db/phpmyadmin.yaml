apiVersion: v1
kind: ConfigMap
metadata:
  name: phpmyadmin-user-config
  namespace: managed-db
data:
  config.user.inc.php: |
    <?php
    $cfg['ExecTimeLimit'] = 600;
    $cfg['MemoryLimit'] = '512M';

    // Normalize colon to space for arbitrary server in all request arrays
    foreach (['_REQUEST', '_POST', '_GET'] as $src) {
        if (isset($GLOBALS[$src]['pma_servername'])) {
            $GLOBALS[$src]['pma_servername'] = str_replace(':', ' ', trim($GLOBALS[$src]['pma_servername']));
        }
    }
    if (!empty($_GET['pma_servername'])) {
        $GLOBALS['pma_auth_server'] = str_replace(':', ' ', trim($_GET['pma_servername']));
    }

    // Auto-fill javascript for login page
    register_shutdown_function(function() {
        if (isset($_GET['pma_servername']) || isset($_GET['pma_username'])) {
            $server = htmlspecialchars($_GET['pma_servername'] ?? '', ENT_QUOTES);
            $user = htmlspecialchars($_GET['pma_username'] ?? '', ENT_QUOTES);
            echo "<script>
            (function() {
                function prefill() {
                    var s = document.getElementById('serverNameInput');
                    var u = document.getElementById('input_username');
                    if (s && '{$server}') s.value = '{$server}'.replace(':', ' ');
                    if (u && '{$user}') u.value = '{$user}';
                }
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', prefill);
                } else {
                    prefill();
                }
                setTimeout(prefill, 200);
                setTimeout(prefill, 500);
            })();
            </script>";
        }
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: managed-db
  labels:
    app: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin/phpmyadmin:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: PMA_ARBITRARY
          value: "1"
        - name: UPLOAD_LIMIT
          value: 512M
        - name: MEMORY_LIMIT
          value: 512M
        volumeMounts:
        - name: user-config
          mountPath: /etc/phpmyadmin/config.user.inc.php
          subPath: config.user.inc.php
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1024Mi
      volumes:
      - name: user-config
        configMap:
          name: phpmyadmin-user-config
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: managed-db
spec:
  selector:
    app: phpmyadmin
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phpmyadmin-ingress
  namespace: managed-db
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pma.db.masdika.id
    secretName: pma-tls
  rules:
  - host: pma.db.masdika.id
    http:
      paths:
      - backend:
          service:
            name: phpmyadmin
            port:
              number: 80
        path: /
        pathType: Prefix
