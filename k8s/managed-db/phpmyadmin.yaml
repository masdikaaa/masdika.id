apiVersion: v1
kind: ConfigMap
metadata:
  name: phpmyadmin-user-config
  namespace: managed-db
data:
  config.user.inc.php: |
    <?php
    // Automatically parse host:port into 'host port' for phpMyAdmin arbitrary server support
    if (isset($_REQUEST['pma_servername'])) {
        $server = trim($_REQUEST['pma_servername']);
        if (strpos($server, ':') !== false) {
            [$h, $p] = explode(':', $server, 2);
            $_REQUEST['pma_servername'] = $h . ' ' . $p;
        }
    }
    if (isset($_REQUEST['pma_port']) && !empty($_REQUEST['pma_port']) && isset($_REQUEST['pma_servername'])) {
        if (strpos($_REQUEST['pma_servername'], ' ') === false) {
            $_REQUEST['pma_servername'] .= ' ' . trim($_REQUEST['pma_port']);
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: managed-db
  labels:
    app: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin/phpmyadmin:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: PMA_ARBITRARY
          value: "1"
        - name: UPLOAD_LIMIT
          value: 128M
        - name: MEMORY_LIMIT
          value: 256M
        volumeMounts:
        - name: user-config
          mountPath: /etc/phpmyadmin/config.user.inc.php
          subPath: config.user.inc.php
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: user-config
        configMap:
          name: phpmyadmin-user-config
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: managed-db
spec:
  selector:
    app: phpmyadmin
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phpmyadmin-ingress
  namespace: managed-db
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pma.db.masdika.id
    secretName: pma-tls
  rules:
  - host: pma.db.masdika.id
    http:
      paths:
      - backend:
          service:
            name: phpmyadmin
            port:
              number: 80
        path: /
        pathType: Prefix
