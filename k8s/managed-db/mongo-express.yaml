apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-default
  namespace: managed-db
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:7.0
        command: ["mongod"]
        args: ["--bind_ip_all"]
        ports:
        - containerPort: 27017
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: managed-db
spec:
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: managed-db
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
      - name: mongo-express
        image: mongo-express:latest
        ports:
        - containerPort: 8081
        env:
        - name: ME_CONFIG_MONGODB_ENABLE_ADMIN
          value: "true"
        - name: ME_CONFIG_BASICAUTH
          value: "false"
        - name: ME_CONFIG_SITE_COOKIESECRET
          value: "masdika-mongo-cookie-secret-key-123"
        - name: ME_CONFIG_SITE_SESSIONSECRET
          value: "masdika-mongo-session-secret-key-123"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  namespace: managed-db
spec:
  selector:
    app: mongo-express
  ports:
  - port: 80
    targetPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mongo-ingress
  namespace: managed-db
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - mongo.db.masdika.id
    secretName: mongo-tls
  rules:
  - host: mongo.db.masdika.id
    http:
      paths:
      - backend:
          service:
            name: mongo-express
            port:
              number: 80
        path: /
        pathType: Prefix
