# ==============================================================================
# ZERO-TRUST CRYPTOGRAPHIC mTLS ENFORCEMENT (ISO 27001 / SOC 2 Type II)
# All inter-pod communication is strictly encrypted with auto-rotated x509 certs
# ==============================================================================
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: masdika
  labels:
    app.kubernetes.io/part-of: masdika
    security.istio.io/compliance: iso27001-soc2
spec:
  mtls:
    mode: STRICT

---
# ==============================================================================
# INGRESS POD COMPLIANCE (Permits initial termination before STRICT mesh mTLS)
# ==============================================================================
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: ingress-mtls
  namespace: istio-system
spec:
  mtls:
    mode: PERMISSIVE
