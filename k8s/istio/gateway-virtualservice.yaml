# ==============================================================================
# ISTIO INGRESS GATEWAY, VIRTUALSERVICE & CIRCUIT BREAKER
# Advanced Traffic Management, Canary Releases & Resilience
# ==============================================================================
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: masdika-gateway
  namespace: masdika
  labels:
    app.kubernetes.io/part-of: masdika
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "masdika.id"
        - "*.masdika.id"
      tls:
        httpsRedirect: false # Set true if SSL is terminated at Istio Gateway instead of Cloudflare
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: masdika-tls-secret
      hosts:
        - "masdika.id"
        - "*.masdika.id"

---
# ==============================================================================
# VIRTUAL SERVICE (Routing, Timeouts, Retries & Canary Deployment)
# ==============================================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: masdika-virtualservice
  namespace: masdika
  labels:
    app.kubernetes.io/part-of: masdika
spec:
  hosts:
    - "masdika.id"
    - "*.masdika.id"
  gateways:
    - masdika-gateway
    - mesh
  http:
    # 1. High-speed WebSocket route for VPS VNC Console
    - name: "vps-vnc-websocket"
      match:
        - uri:
            prefix: "/api/vps/vnc"
        - uri:
            prefix: "/vnc"
      route:
        - destination:
            host: masdika-vnc-proxy.masdika.svc.cluster.local
            port:
              number: 3001
      websocketUpgrade: true
      timeout: 3600s # 1 hour long-running interactive session

    # 2. Main Next.js Web Application (with Canary Split capability)
    - name: "masdika-web-route"
      match:
        - uri:
            prefix: "/"
      route:
        # Stable Production (v1) - 100% traffic by default
        - destination:
            host: masdika-app.masdika.svc.cluster.local
            port:
              number: 3000
          weight: 100
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: "5xx,connect-failure,refused-stream"

---
# ==============================================================================
# DESTINATION RULES (mTLS Mutual, Connection Pool & Circuit Breakers)
# ==============================================================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: masdika-app-destination
  namespace: masdika
  labels:
    app.kubernetes.io/part-of: masdika
spec:
  host: masdika-app.masdika.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 1024
      http:
        http1MaxPendingRequests: 200
        maxRequestsPerConnection: 10
    # Circuit Breaker: Outlier Detection
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: masdika-vnc-destination
  namespace: masdika
spec:
  host: masdika-vnc-proxy.masdika.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 512

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: masdika-db-destination
  namespace: masdika
spec:
  host: masdika-db.masdika.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 500

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: masdika-pgbouncer-destination
  namespace: masdika
spec:
  host: masdika-pgbouncer.masdika.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 500

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: masdika-redis-destination
  namespace: masdika
spec:
  host: masdika-redis.masdika.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 500
