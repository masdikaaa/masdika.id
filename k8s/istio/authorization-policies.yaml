# ==============================================================================
# ZERO-TRUST LAYER 7 AUTHORIZATION POLICIES (ISO 27001 Access Control)
# Explicit principle of least privilege: only permitted pods can talk to each other
# ==============================================================================

# 1. Allow Web Ingress Gateway to access Next.js App
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-app
  namespace: masdika
spec:
  selector:
    matchLabels:
      app: masdika-app
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/masdika/sa/default"
              - "cluster.local/ns/masdika/sa/masdika-app-sa"
      to:
        - operation:
            ports: ["3000"]

---
# 2. Allow Ingress Gateway to access VNC WebSocket Proxy
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-vnc-proxy
  namespace: masdika
spec:
  selector:
    matchLabels:
      app: masdika-vnc-proxy
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/masdika/sa/default"
      to:
        - operation:
            ports: ["3001"]

---
# 3. Allow only Application & Worker to communicate with PgBouncer / Postgres
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-app-to-database
  namespace: masdika
spec:
  selector:
    matchLabels:
      app: masdika-db
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/masdika/sa/default"
              - "cluster.local/ns/masdika/sa/masdika-app-sa"
      to:
        - operation:
            ports: ["5432"]

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-app-to-pgbouncer
  namespace: masdika
spec:
  selector:
    matchLabels:
      app: masdika-pgbouncer
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/masdika/sa/default"
              - "cluster.local/ns/masdika/sa/masdika-app-sa"
      to:
        - operation:
            ports: ["5432", "6432"]

---
# 4. Allow only Application & Worker to communicate with Redis Cache
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-app-to-redis
  namespace: masdika
spec:
  selector:
    matchLabels:
      app: masdika-redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/masdika/sa/default"
              - "cluster.local/ns/masdika/sa/masdika-app-sa"
      to:
        - operation:
            ports: ["6379"]

---
# 5. Allow telemetry pipeline & workers to access Kafka Message Broker
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-mesh-to-kafka
  namespace: masdika
spec:
  selector:
    matchLabels:
      app: masdika-kafka
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/masdika/sa/default"
              - "cluster.local/ns/masdika/sa/masdika-app-sa"
              - "cluster.local/ns/keda/sa/keda-operator"
      to:
        - operation:
            ports: ["9092", "9093"]

---
# 6. Allow search engine consumers to access Elasticsearch
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-mesh-to-elasticsearch
  namespace: masdika
spec:
  selector:
    matchLabels:
      app: masdika-elasticsearch
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/masdika/sa/default"
              - "cluster.local/ns/masdika/sa/masdika-app-sa"
      to:
        - operation:
            ports: ["9200"]
