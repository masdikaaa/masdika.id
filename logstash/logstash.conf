input {
  # Accept logs via HTTP on port 5044
  http {
    port => 5044
  }
}

filter {
  # Default empty filter
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "logstash-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
