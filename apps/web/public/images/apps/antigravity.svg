<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="agy-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </linearGradient>
    <linearGradient id="agy-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#c5221f" />
    </linearGradient>
    <linearGradient id="agy-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#f29900" />
    </linearGradient>
    <linearGradient id="agy-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#188038" />
    </linearGradient>
    <filter id="agy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Google Antigravity Geometric Prism Delta -->
  <g filter="url(#agy-shadow)">
    <!-- Top Apex Segment (Blue) -->
    <path d="M64 16 L98 76 L80 76 L64 48 L48 76 L30 76 Z" fill="url(#agy-blue)" />
    
    <!-- Left Wing (Green) -->
    <path d="M64 48 L48 76 L22 76 L48 30 Z" fill="url(#agy-green)" />

    <!-- Right Wing (Yellow) -->
    <path d="M64 48 L80 76 L106 76 L80 30 Z" fill="url(#agy-yellow)" />

    <!-- Bottom Beam Base (Red) -->
    <path d="M22 76 L106 76 L94 98 L34 98 Z" fill="url(#agy-red)" />

    <!-- Inverted Antigravity Float Core (Cyan Accent) -->
    <polygon points="64,36 82,68 46,68" fill="#38BDF8" opacity="0.9" />
    <circle cx="64" cy="56" r="6" fill="#FFFFFF" />
  </g>
</svg>

