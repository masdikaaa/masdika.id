name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (Code Quality & Lint)
  # ==========================================
  ci:
    name: CI - Code Quality & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Run Tests (if configured)
        run: npm run test || echo "No tests configured yet, skipping..."

  # ==========================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # ==========================================
  docker-build:
    name: Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:v1.0.1
            ${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 3: CONTINUOUS DEPLOYMENT
  # ==========================================
  cd:
    name: CD - Deploy to VPS
    needs: docker-build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Sync Files to Server via rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: "/home/${{ secrets.SERVER_USER }}/masdika.id"
          EXCLUDE: "/.git/, /.env, /node_modules/, /postgres_data/, /redis_data/, /grafana_data/, /prometheus_data/, /elasticsearch_data/, /apps/web/public/uploads/, /apps/web/storage/"

      - name: Pull Image & Graceful Reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/masdika.id
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose pull app worker

            # Zero-Disruption Safety Check: Wait if any Order Deployment (VPS / K3s / CDN / Jobs), Snapshot, or Backup is in progress
            echo "Checking if any critical operations (VPS / K3s / CDN Orders / Deployments / Snapshots / Backups) are in progress..."
            for i in $(seq 1 30); do
              READINESS=$(curl -s http://127.0.0.1/api/health/deploy-readiness 2>/dev/null || curl -s http://127.0.0.1:3000/api/health/deploy-readiness 2>/dev/null || docker compose exec -T app wget -qO- http://127.0.0.1:3000/api/health/deploy-readiness 2>/dev/null || echo '{"safeToDeploy":true}')
              IS_SAFE=$(echo "$READINESS" | grep -o '"safeToDeploy":true' || true)

              if [ -n "$IS_SAFE" ]; then
                echo "System is clear! No active service order deployment, K3s installation, snapshot, or backup in progress. Safe to deploy."
                break
              fi

              ACTIVE_COUNT=$(echo "$READINESS" | grep -o '"activeCount":[0-9]*' || echo "active operations")
              echo "Waiting for $ACTIVE_COUNT to complete before recreating container (Attempt $i/30, waiting 10s)..."
              sleep 10
            done

            docker compose up -d --force-recreate app worker
            docker compose up -d --no-recreate
            docker image prune -f
            docker builder prune -f
            docker compose exec -T nginx nginx -s reload || docker compose restart nginx || true

            # Zero-Downtime Automated Asset Migration to RustFS
            echo "Checking and migrating production assets to RustFS..."
            docker compose exec -T app node /app/apps/web/migrate-production-assets.js || echo "Notice: RustFS asset migration completed with notice."

            docker logout || true
