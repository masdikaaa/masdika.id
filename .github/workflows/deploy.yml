name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (Code Quality & Lint)
  # ==========================================
  ci:
    name: CI - Code Quality & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Run Tests (if configured)
        run: npm run test || echo "No tests configured yet, skipping..."

  # ==========================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # ==========================================
  docker-build:
    name: Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:v1.0.1
            ${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 3: CONTINUOUS DEPLOYMENT
  # ==========================================
  cd:
    name: CD - Deploy to VPS
    needs: docker-build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Sync Files to Server via rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: "/home/${{ secrets.SERVER_USER }}/masdika.id"
          EXCLUDE: "/.git/, /.env, /node_modules/, /postgres_data/, /redis_data/, /grafana_data/, /prometheus_data/, /elasticsearch_data/, /apps/web/public/uploads/, /apps/web/storage/"

      - name: Pull Image & Graceful Reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/masdika.id

            # Zero-Disruption Safety Check: Wait if any Order Deployment (VPS / K3s / CDN / Jobs), Snapshot, or Backup is in progress
            echo "Checking if any critical operations (VPS / K3s / CDN Orders / Deployments / Snapshots / Backups) are in progress..."
            for i in $(seq 1 30); do
              READINESS=$(curl -s http://127.0.0.1/api/health/deploy-readiness 2>/dev/null || curl -s http://127.0.0.1:3000/api/health/deploy-readiness 2>/dev/null || echo '{"safeToDeploy":true}')
              IS_SAFE=$(echo "$READINESS" | grep -o '"safeToDeploy":true' || true)

              if [ -n "$IS_SAFE" ]; then
                echo "System is clear! No active service order deployment, K3s installation, snapshot, or backup in progress. Safe to deploy."
                break
              fi

              ACTIVE_COUNT=$(echo "$READINESS" | grep -o '"activeCount":[0-9]*' || echo "active operations")
              echo "Waiting for $ACTIVE_COUNT to complete before updating deployment (Attempt $i/30, waiting 10s)..."
              sleep 10
            done

            # Setup KUBECONFIG for non-root SSH user if available
            export KUBECONFIG="${HOME}/.kube/config"
            if [ ! -f "$KUBECONFIG" ] && [ -r "/etc/rancher/k3s/k3s.yaml" ]; then
              export KUBECONFIG="/etc/rancher/k3s/k3s.yaml"
            fi

            # Detect whether host is running an active K3s Kubernetes cluster
            if command -v kubectl >/dev/null 2>&1 && kubectl get nodes >/dev/null 2>&1; then
              echo "🚀 Detected active K3s Kubernetes cluster!"

              # 1. Ensure namespace masdika exists
              kubectl get namespace masdika >/dev/null 2>&1 || kubectl create namespace masdika

              # 2. Ensure secret masdika-env is synced cleanly from server's .env file if available
              if [ -f .env ]; then
                echo "Syncing secret masdika-env from cleaned .env..."
                if [ -f scripts/sync-k8s-env.py ]; then
                  python3 scripts/sync-k8s-env.py || true
                fi
                if [ -f .env.clean ]; then
                  kubectl create secret generic masdika-env --from-env-file=.env.clean -n masdika --dry-run=client -o yaml | kubectl apply -f -
                  rm -f .env.clean
                fi
              fi

              # 3. Ensure Docker Hub registry secret exists for pulling private images
              if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
                kubectl create secret docker-registry dockerhub-secret \
                  --docker-server=https://index.docker.io/v1/ \
                  --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
                  --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
                  -n masdika --dry-run=client -o yaml | kubectl apply -f -
              fi

              # 4. Apply latest manifest changes (Deployments, Services, ConfigMaps, Ingress, HPA)
              echo "Applying k3s-masdika.yaml manifest..."
              kubectl apply -f k3s-masdika.yaml

              # 5. Trigger zero-downtime rolling update with exact commit SHA
              echo "Updating deployments to newly built image tag (${{ github.sha }})..."
              if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
                kubectl set image deployment/masdika-app app=${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:${{ github.sha }} -n masdika
                kubectl set image deployment/masdika-worker worker=${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:${{ github.sha }} -n masdika
                kubectl set image deployment/masdika-vnc-proxy vnc-proxy=${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:${{ github.sha }} -n masdika
              else
                kubectl rollout restart deployment masdika-app masdika-worker masdika-vnc-proxy -n masdika
              fi

              # 6. Wait for new pods to achieve Healthy/Ready status
              kubectl rollout status deployment/masdika-app -n masdika --timeout=180s
              kubectl rollout status deployment/masdika-worker -n masdika --timeout=180s
              kubectl rollout status deployment/masdika-vnc-proxy -n masdika --timeout=120s

              echo "✅ K3s deployment updated and running successfully with zero downtime!"
            else
              echo "❌ Error: K3s cluster not found or unreachable! Docker Compose fallback has been permanently disabled as requested."
              exit 1
            fi
