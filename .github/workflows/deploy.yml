name: CI/CD GitOps Pipeline

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'k8s/**'
      - 'README.md'
      - 'design.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (Code Quality & Lint)
  # ==========================================
  ci:
    name: CI - Code Quality & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Dependency Security Audit
        run: npm audit --audit-level=high || echo "Dependency audit completed with non-blocking advisories"

      - name: Run Tests (if configured)
        run: npm run test || echo "No tests configured yet, skipping..."

  # ==========================================
  # JOB 2: SAST (Static Application Security Testing)
  # ==========================================
  sast:
    name: SAST - Security & Vulnerability Scan
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Semgrep SAST Security Scanner
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep:latest \
            semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/javascript" \
            --config "p/typescript" \
            --config "p/secrets" \
            --exclude="node_modules" \
            --exclude=".next" \
            --exclude="apps/web/public/novnc*" \
            --exclude="*.sql" \
            --exclude="*.md" \
            --error \
            --severity ERROR

  # ==========================================
  # JOB 3: BUILD & PUSH DOCKER IMAGE
  # ==========================================
  docker-build:
    name: Build & Push Docker Image
    needs: [ci, sast]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # CONTAINER VULNERABILITY SCAN (TRIVY)
      # ==========================================
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/masdika-id:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # JOB 4: GITOPS MANIFEST UPDATE (ArgoCD Auto-Sync)
  # ==========================================
  gitops-deploy:
    name: GitOps - Update Image Tag for ArgoCD
    needs: docker-build
    runs-on: ubuntu-24.04
    env:
      MANIFEST_FILE: k8s/app/deployment.yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update Image Tag in Kubernetes Manifest
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Updating $MANIFEST_FILE with new image tag: $IMAGE_TAG"

          python3 -c "
          import os, re
          manifest = os.environ.get('MANIFEST_FILE', 'k8s/app/deployment.yaml')
          tag = os.environ.get('IMAGE_TAG')
          with open(manifest, 'r') as f:
              content = f.read()

          new_content, count = re.subn(
              r'(image:\s+[^\s]+/masdika-id:)[a-zA-Z0-9_.-]+',
              rf'\g<1>{tag}',
              content
          )

          with open(manifest, 'w') as f:
              f.write(new_content)

          print(f'Successfully updated {count} container images to tag {tag}')
          "

          echo "=== Manifest Diff ==="
          git diff "$MANIFEST_FILE"

      - name: Commit & Push GitOps Manifest
        env:
          COMMIT_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
          MANIFEST_FILE: k8s/app/deployment.yaml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if ! git diff --staged --quiet; then
            git commit -m "chore(gitops): update image tag to $COMMIT_SHA [skip ci]"
            git push origin HEAD:"$TARGET_BRANCH"
            echo "🚀 Manifest successfully pushed to Git! ArgoCD will automatically detect and reconcile the deployment."
          else
            echo "No changes in manifest. Skipping commit."
          fi
