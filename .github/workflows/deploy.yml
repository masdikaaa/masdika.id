name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (Pengecekan)
  # ==========================================
  ci:
    name: CI - Build & Lint Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint
        continue-on-error: true # Biarkan lanjut jika hanya ada peringatan kecil/style

      - name: Dry-Run Build Test
        run: npm run build
        env:
          # Memberikan dummy environment jika Next.js butuh ENV saat proses build
          DATABASE_URL: "postgresql://dummy:password@localhost:5432/masdika?schema=public"

  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT (Pengiriman)
  # ==========================================
  cd:
    name: CD - Deploy to VPS
    needs: ci # SYARAT UTAMA: Job 'ci' harus Sukses/Hijau baru 'cd' bisa jalan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync Files to Server via rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: "/home/${{ secrets.SERVER_USER }}/masdika.id"
          EXCLUDE: "/.git/, /.env, /node_modules/, /postgres_data/, /redis_data/, /grafana_data/, /prometheus_data/, /elasticsearch_data/, /apps/web/public/uploads/, /apps/web/storage/"

      - name: Restart Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/masdika.id
            docker compose up -d --build
